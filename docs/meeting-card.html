<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Social Card Target | This Week in Bitcoin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;0,6..72,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #F1F2DC;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Newsreader', serif;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: #333; /* Dark bg so Playwright sees borders */
            display: flex;
            justify-content: center;
        }

        .meeting-social-card {
            width: 1200px;
            height: 675px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border: 1px solid #D8DAB8;
            border-radius: 12px;
            padding: 38px 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .meeting-social-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1.5px solid #D8DAB8;
            padding-bottom: 18px;
        }

        .meeting-social-card .header-tag {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #E8916B;
            margin-bottom: 6px;
        }

        .meeting-social-card .card-title {
            font-family: var(--font-serif);
            font-size: 38px;
            font-weight: 700;
            color: #1A1D24;
            line-height: 1.1;
            margin: 0;
        }

        .meeting-social-card .card-date {
            font-family: var(--font-sans);
            font-size: 18px;
            color: #555B66;
            margin-top: 6px;
        }

        .meeting-social-card .logo-container img {
            height: 44px;
            width: auto;
        }

        .meeting-social-card .card-body {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 30px;
            margin: 20px 0;
            flex-grow: 1;
        }

        .meeting-social-card .card-box {
            background-color: #E5E7CC;
            border-radius: 8px;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .meeting-social-card .box-title {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4A4E57;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meeting-social-card .stats-pill-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .meeting-social-card .stat-pill {
            background: #F1F2DC;
            border: 1px solid #D0D2B4;
            border-radius: 6px;
            padding: 8px 14px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            color: #1A1D24;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meeting-social-card .topics-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .meeting-social-card .topics-list li {
            font-family: var(--font-serif);
            font-size: 18px;
            line-height: 1.35;
            color: #1A1D24;
            margin-bottom: 10px;
            position: relative;
            padding-left: 18px;
        }

        .meeting-social-card .topics-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #E8916B;
            font-size: 22px;
            line-height: 18px;
        }

        .meeting-social-card .decisions-quote {
            font-family: var(--font-serif);
            font-size: 20px;
            line-height: 1.4;
            color: #1A1D24;
            border-left: 3px solid #2e7559;
            padding-left: 14px;
            margin-bottom: 16px;
        }

        .meeting-social-card .prs-badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meeting-social-card .pr-badge {
            background: #F1F2DC;
            border: 1px solid #C8CAB0;
            border-radius: 4px;
            padding: 4px 10px;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            color: #2A3342;
        }

        .meeting-social-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #D8DAB8;
            padding-top: 14px;
            font-family: var(--font-sans);
            font-size: 14px;
            color: #555B66;
        }
    </style>
</head>
<body>

    <!-- Executive Meeting Social Card Target (1200x675) -->
    <div class="meeting-social-card" id="meeting-social-card">
        <div class="card-header">
            <div>
                <div class="header-tag">BITCOIN CORE DEV MEETING DEBRIEF</div>
                <h2 class="card-title">Weekly Engineering Sync</h2>
                <div class="card-date" id="mcard-date">Loading sync date...</div>
            </div>
            <div class="logo-container">
                <img src="images/favicon.png" onerror="this.src='https://bitcoindatalabs.org/favicon.png'" alt="BDL Logo">
            </div>
        </div>

        <div class="card-body">
            <div class="card-box">
                <div class="box-title">
                    <i class="fa-solid fa-comments" style="color: #E8916B;"></i>
                    <span>Primary Agenda & Topics</span>
                </div>
                <ul class="topics-list" id="mcard-topics">
                    <li>Syncing topics...</li>
                </ul>
                <div class="stats-pill-row" id="mcard-pills" style="margin-top: auto; margin-bottom: 0;">
                    <div class="stat-pill"><i class="fa-solid fa-users" style="color: #E8916B;"></i> <span id="mcard-participants">--</span></div>
                    <div class="stat-pill"><i class="fa-solid fa-circle-check" style="color: #2e7559;"></i> <span id="mcard-decisions-count">--</span></div>
                </div>
            </div>

            <div class="card-box">
                <div class="box-title">
                    <i class="fa-solid fa-circle-check" style="color: #2e7559;"></i>
                    <span>Consensus & Decisions</span>
                </div>
                <div class="decisions-quote" id="mcard-decision-text">
                    "Reviewing consensus changes and peer review bandwidth."
                </div>
                <div style="margin-top: auto;">
                    <div class="box-title" style="margin-bottom: 8px;">
                        <i class="fa-solid fa-code-pull-request" style="color: #E8916B;"></i>
                        <span>PRs Discussed</span>
                    </div>
                    <div class="prs-badge-container" id="mcard-prs">
                        <span class="pr-badge">#--</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <span id="mcard-permalink-text">twib.bitcoindatalabs.org/meetings.html</span>
            <span>Bitcoin Data Labs</span>
        </div>
    </div>

    <!-- Inject JS to hydrate card if needed -->
    <script>
        // Check if query params have data (if Python script passes them via route mocking)
        const params = new URLSearchParams(window.location.search);
        
        // This acts as a signal for Playwright that rendering is ready
        setTimeout(() => {
            document.body.setAttribute('data-loaded', 'true');
        }, 500);
    </script>
</body>
</html>
